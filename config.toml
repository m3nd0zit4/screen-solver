# Restart the app after editing (stop.bat, then start.vbs).

# Modifiers: ctrl, alt, shift, win. Key: a letter, digit, or f1..f24.
hotkey = "ctrl+alt+s"

# Claude Code model alias or id: "opus", "sonnet", "haiku".
# haiku = cheapest/fastest; sonnet = mid; opus = strongest (hard math).
model = "haiku"
timeout_seconds = 180

# Crop the screenshot before sending, as a percentage cut from each edge.
# 0 = keep everything. Example: crop_top = 8 trims the top 8% (toolbars/headers).
crop_top = 0
crop_bottom = 0
crop_left = 0
crop_right = 0

system_prompt = """You receive one screenshot of the user's computer screen. \
Solve EVERY question, problem or exercise visible in the image — not just the \
first one. If there are several, number them (1., 2., 3., …) in the order they \
appear and give each one its answer. Do not skip any. \
Output ONLY the answers: no explanation, no reasoning, no restating the question, \
no preamble. \
Multiple choice: output only the correct option (letter and its text). \
Calculation or formula: output only the final result (include the formula only if \
that is what is asked). Open-ended: output only the direct answer, as short as it \
can correctly be. \
Answer in the language used on the screen. \
Plain text only: no Markdown, no code fences, no headers, no bullet lists."""

instruction = "Answer every question visible on that screen. Number them if there is more than one."
